<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>test · cuestionarios en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141a2b;--panel:#1f2740;--ink:#f3f1ff;--mute:#9aa3c4;--c0:#ef5b5b;--c1:#3b82f6;--c2:#f5b82e;--c3:#22b8a0;--ok:#3ddc97;--bad:#ff6b6b;box-sizing:border-box}
@media (prefers-color-scheme:light){:root{--bg:#eef0f8;--panel:#fff;--ink:#141a2b;--mute:#5b6485}}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:980px;margin:0 auto;padding:24px 18px 48px;display:flex;flex-direction:column;gap:18px;min-height:100%}
h1{font-size:clamp(3rem,12vw,6rem);margin:0;font-weight:800;letter-spacing:-.04em;line-height:.9}
h2{margin:0;font-size:clamp(1.4rem,4.5vw,2.4rem);font-weight:800;line-height:1.15}
p{margin:0;color:var(--mute);line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
input{font:inherit;color:inherit;background:transparent;border:2px solid var(--mute);border-radius:10px;padding:12px 14px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:14px 22px;background:var(--c1);color:#fff;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--mute)}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.code{font-size:clamp(3rem,14vw,7rem);font-weight:800;letter-spacing:.14em;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);padding:6px 12px;border-radius:99px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-weight:800;font-size:clamp(1rem,3.5vw,1.5rem);color:#141a2b;border:0;border-radius:12px;padding:20px 16px;min-height:96px;display:flex;gap:12px;align-items:center;text-align:left;position:relative;overflow:hidden}
button.opt{cursor:pointer}
.opt i{font-style:normal;font-size:1.6em}
.opt.c0{background:var(--c0)}.opt.c1{background:var(--c1);color:#fff}.opt.c2{background:var(--c2)}.opt.c3{background:var(--c3)}
.opt.dim{opacity:.35}
.opt b{margin-left:auto;font-size:1.6em}
.bar{height:10px;border-radius:9px;background:var(--panel);overflow:hidden}
.bar>div{height:100%;background:var(--c2);width:100%;transition:width .25s linear}
.big{font-size:clamp(4rem,20vw,9rem);font-weight:800;line-height:1}
.center{align-items:center;text-align:center;justify-content:center;flex:1}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ol.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.rank li{display:flex;gap:12px;background:var(--panel);padding:10px 14px;border-radius:10px;font-weight:600}
ol.rank li span:nth-child(2){flex:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:300px}
.pod{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-weight:800;text-align:center;gap:6px}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:2.4rem;padding-top:10px;color:#141a2b}
.pod.p1 .blk{height:200px;background:var(--c2)}.pod.p2 .blk{height:140px;background:#c9d1e8}.pod.p3 .blk{height:100px;background:#d99060}
.pod small{color:var(--mute);font-weight:600}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
const $app=document.getElementById('app');
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}c.flat().forEach(x=>{if(x!=null)e.append(x.nodeType?x:document.createTextNode(x))});return e};
const show=(...n)=>$app.replaceChildren(...n);
const SH=['▲','◆','●','■'],LT='ABCD';
let H=null,S=null;

/* ---------- CSV ---------- */
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const l=t.split('\n')[0];
  const d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function toQs(rows){
  if(rows.length&&!/^[A-Da-d1-4]$/.test((rows[0][5]||'').trim()))rows=rows.slice(1);
  const qs=[],errs=[];
  rows.forEach((r,n)=>{
    const text=(r[0]||'').trim(),opts=r.slice(1,5).map(x=>x.trim()).filter(Boolean);
    const v=(r[5]||'').trim().toUpperCase();let c=LT.indexOf(v);if(c<0)c=parseInt(v)-1;
    if(!text||opts.length<2||!(c>=0&&c<opts.length))errs.push(n+1);
    else qs.push({text,opts,c,time:Math.min(120,Math.max(5,parseInt(r[6])||20))});
  });
  if(errs.length)throw new Error('Revisa las filas de datos: '+errs.join(', ')+'. Cada una necesita pregunta, 2 a 4 opciones y la correcta (A-D o 1-4).');
  if(!qs.length)throw new Error('El CSV no tiene preguntas.');
  return qs;
}

/* ---------- Cifrado (AES-GCM + PBKDF2) ---------- */
const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pass,salt){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encrypt(pass,obj){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pass,salt),new TextEncoder().encode(JSON.stringify(obj))));
  const o=new Uint8Array(28+ct.length);o.set(salt);o.set(iv,16);o.set(ct,28);return b64(o);
}
async function decrypt(pass,s){
  const o=unb64(s);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:o.slice(16,28)},await key(pass,o.slice(0,16)),o.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- Inicio ---------- */
function home(){
  const c=new URLSearchParams(location.search).get('c');
  if(c)return studentJoin(c.toUpperCase());
  show(el('h1',{},'test'),
    p('Cuestionarios de selección múltiple en vivo. Sin servidor ni cuentas: todo ocurre en el navegador de cada participante.'),
    el('div',{class:'row'},el('button',{class:'btn',onclick:()=>hostSetup()},'Soy docente'),el('button',{class:'btn alt',onclick:()=>studentJoin('')},'Soy estudiante')));
}
const p=t=>el('p',{},t);

/* ---------- Docente ---------- */
function hostSetup(msg){
  const f=el('input',{type:'file',accept:'.csv,text/csv'}),
        pw=el('input',{type:'password',autocomplete:'new-password',placeholder:'Mínimo 6 caracteres'}),
        err=el('p',{class:'err'},msg||''),btn=el('button',{class:'btn'},'Cargar y abrir sala');
  btn.onclick=async()=>{
    try{
      if(!f.files[0])throw new Error('Selecciona el archivo CSV.');
      if(pw.value.length<6)throw new Error('La frase de paso debe tener al menos 6 caracteres.');
      btn.disabled=true;err.textContent='Cifrando y abriendo sala…';
      const qs=toQs(parseCSV(await f.files[0].text()));
      openRoom(await encrypt(pw.value,qs));
    }catch(e){btn.disabled=false;err.textContent=e.message}
  };
  const tpl=el('a',{href:'data:text/csv;charset=utf-8,'+encodeURIComponent('pregunta,A,B,C,D,correcta,segundos\n"¿Capital de Bolivia?",La Paz,Sucre,Cochabamba,Santa Cruz,B,20\n'),download:'plantilla.csv',style:'color:var(--c2)'},'Descargar plantilla CSV');
  show(h('Nueva sala'),el('div',{class:'card'},
    el('label',{},'Archivo CSV con el test',f),
    el('label',{},'Frase de paso (protege las respuestas correctas)',pw),
    p('Columnas: pregunta, A, B, C, D, correcta (A-D o 1-4), segundos.'),tpl,err,btn),
    el('button',{class:'btn alt',onclick:home},'Volver'));
}
const h=t=>el('h2',{},t);
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(6));return[...r].map(x=>a[x%a.length]).join('')}
function openRoom(enc,tries=0){
  const code=genCode(),peer=new Peer('kt-'+code);
  peer.on('open',()=>{
    H={code,enc,peer,players:new Map(),phase:'lobby',qs:null,qi:-1};
    try{sessionStorage.setItem('kt-enc',enc)}catch{}
    lobby();
  });
  peer.on('connection',c=>c.on('data',m=>onHost(c,m)));
  peer.on('error',e=>{if(H)return;if(e.type==='unavailable-id'&&tries<5)openRoom(enc,tries+1);else hostSetup('No se pudo abrir la sala ('+e.type+'). Revisa tu conexión.')});
}
function send(p,m){try{p.conn&&p.conn.open&&p.conn.send(m)}catch{}}
function onHost(c,m){
  if(m.t==='join'){
    const name=String(m.name||'').trim().slice(0,20),tok=String(m.tok||'').slice(0,60);
    let pl=H.players.get(tok);
    if(pl)pl.conn=c;
    else{
      if(H.phase!=='lobby')return c.send({t:'err',m:'La partida ya comenzó.'});
      if(!name)return c.send({t:'err',m:'Escribe tu nombre.'});
      if([...H.players.values()].some(x=>x.name.toLowerCase()===name.toLowerCase()))return c.send({t:'err',m:'Ese nombre ya está en uso.'});
      pl={name,tok,score:0,ms:0,rec:[],conn:c};H.players.set(tok,pl);
    }
    c.send({t:'ok',name:pl.name});sync(pl);
    if(H.phase==='lobby')lobby();else if(H.phase==='q')updCount();
  }else if(m.t==='ans'&&H.phase==='q'){
    const pl=H.players.get(m.tok),q=H.qs[H.qi];
    if(!pl||H.ans.has(m.tok)||!Number.isInteger(m.i)||m.i<0||m.i>=q.opts.length)return;
    const ms=Date.now()-H.t0;if(ms>q.time*1000+1500)return;
    H.ans.set(m.tok,{i:m.i,ms});updCount();
    if(H.ans.size>=H.players.size)reveal();
  }
}
function sync(pl){
  if(H.phase==='q'){const q=H.qs[H.qi];send(pl,{t:'q',idx:H.qi,total:H.qs.length,text:q.text,opts:q.opts,ms:Math.max(0,H.endsAt-Date.now()),done:H.ans.has(pl.tok)})}
  else if(H.phase==='reveal'&&pl.last)send(pl,{t:'res',...pl.last});
  else if(H.phase==='end')send(pl,{t:'end',...rankOf(pl)});
}
const bcast=m=>H.players.forEach(pl=>send(pl,m));
const sorted=()=>[...H.players.values()].sort((a,b)=>b.score-a.score||a.ms-b.ms);
const rankOf=pl=>({rank:sorted().indexOf(pl)+1,score:pl.score,n:H.players.size});
function lobby(){
  const pw=el('input',{type:'password',autocomplete:'off',placeholder:'Frase de paso para iniciar'}),err=el('p',{class:'err'}),
        url=location.origin+location.pathname+'?c='+H.code;
  const start=el('button',{class:'btn',onclick:async()=>{
    if(!H.players.size){err.textContent='Aún no hay estudiantes en la sala.';return}
    try{H.qs=await decrypt(pw.value,H.enc)}catch{err.textContent='Frase de paso incorrecta.';return}
    H.phase='q';nextQ(0);
  }},'Iniciar test');
  show(p('Código de sala'),el('div',{class:'code'},H.code),p('Entren en '+url+' o escriban el código en la página.'),
    h('Estudiantes ('+H.players.size+')'),
    el('div',{class:'chips'},[...H.players.values()].map(x=>el('span',{class:'chip'},x.name))),
    el('div',{class:'card'},pw,err,start),
    el('button',{class:'btn alt',onclick:closeRoom},'Cerrar sala'));
}
function nextQ(i){
  H.qi=i;H.phase='q';H.ans=new Map();const q=H.qs[i];
  H.t0=Date.now();H.endsAt=H.t0+q.time*1000;
  bcast({t:'q',idx:i,total:H.qs.length,text:q.text,opts:q.opts,ms:q.time*1000,done:false});
  const bar=el('div'),cnt=el('p'),left=el('p');H.ui={bar,cnt,left};
  show(p('Pregunta '+(i+1)+' de '+H.qs.length),h(q.text),el('div',{class:'bar'},bar),left,
    el('div',{class:'opts'},q.opts.map((o,k)=>el('div',{class:'opt c'+k},el('i',{},SH[k]),o))),
    cnt,el('button',{class:'btn alt',onclick:reveal},'Terminar ahora'));
  updCount();clearInterval(H.iv);
  H.iv=setInterval(()=>{
    const r=H.endsAt-Date.now();
    H.ui.bar.style.width=Math.max(0,r/(q.time*10))+'%';H.ui.left.textContent=Math.ceil(Math.max(0,r)/1000)+' s';
    if(r<=0)reveal();
  },250);
}
function updCount(){if(H.phase==='q'&&H.ui)H.ui.cnt.textContent='Respondieron '+H.ans.size+' de '+H.players.size}
function reveal(){
  if(H.phase!=='q')return;clearInterval(H.iv);H.phase='reveal';
  const q=H.qs[H.qi],counts=q.opts.map(()=>0);
  H.players.forEach((pl,tok)=>{
    const a=H.ans.get(tok),ok=!!a&&a.i===q.c;
    const pts=ok?Math.round(1000*(1-a.ms/(q.time*1000)/2)):0;
    if(a)counts[a.i]++;
    pl.score+=pts;if(ok)pl.ms+=a.ms;
    pl.rec.push({i:a?a.i:-1,ok,ms:a?a.ms:0});pl.last={ok,pts,answered:!!a};
  });
  const rk=sorted();rk.forEach((pl,k)=>{pl.last.rank=k+1;pl.last.score=pl.score;send(pl,{t:'res',...pl.last})});
  const last=H.qi===H.qs.length-1;
  show(p('Respuesta correcta'),h(q.text),
    el('div',{class:'opts'},q.opts.map((o,k)=>el('div',{class:'opt c'+k+(k===q.c?'':' dim')},el('i',{},SH[k]),o,el('b',{},(k===q.c?'✓ ':'')+counts[k])))),
    h('Ranking'),rankList(rk.slice(0,5)),
    el('button',{class:'btn',onclick:()=>last?finish():nextQ(H.qi+1)},last?'Ver podio':'Siguiente pregunta'));
}
const rankList=a=>el('ol',{class:'rank'},a.map((pl,k)=>el('li',{},el('span',{},(k+1)+'.'),el('span',{},pl.name),el('span',{},pl.score+' pts'))));
function finish(){
  H.phase='end';H.players.forEach(pl=>send(pl,{t:'end',...rankOf(pl)}));
  const rk=sorted(),order=[1,0,2].filter(i=>rk[i]);
  show(h('Podio'),
    el('div',{class:'podium'},order.map(i=>el('div',{class:'pod p'+(i+1)},el('span',{},rk[i].name),el('small',{},rk[i].score+' pts'),el('div',{class:'blk'},i+1)))),
    h('Ranking final'),rankList(rk),
    el('div',{class:'row'},el('button',{class:'btn',onclick:exportCSV},'Exportar resultados (CSV)'),el('button',{class:'btn alt',onclick:closeRoom},'Cerrar sala')));
}
function closeRoom(){
  clearInterval(H&&H.iv);try{H.peer.destroy()}catch{}
  try{sessionStorage.removeItem('kt-enc')}catch{}
  H=null;home();
}
function exportCSV(){
  const safe=v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const head=['posicion','nombre','puntaje','correctas'];
  H.qs.forEach((_,k)=>head.push('P'+(k+1)+'_respuesta','P'+(k+1)+'_correcta','P'+(k+1)+'_ms'));
  const rows=sorted().map((pl,k)=>{
    const r=[k+1,pl.name,pl.score,pl.rec.filter(x=>x.ok).length];
    pl.rec.forEach(x=>r.push(x.i<0?'':LT[x.i],x.ok?1:0,x.ms));return r.map(safe).join(',');
  });
  const blob=new Blob(['\uFEFF'+[head.join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'});
  const a=el('a',{href:URL.createObjectURL(blob),download:'resultados-'+H.code+'.csv'});document.body.append(a);a.click();a.remove();
}

/* ---------- Estudiante ---------- */
function studentJoin(code,msg){
  const c=el('input',{value:code,maxlength:6,placeholder:'ABC234',autocapitalize:'characters'}),
        n=el('input',{maxlength:20,placeholder:'Tu nombre'}),err=el('p',{class:'err'},msg||'');
  const go=()=>{const cc=c.value.trim().toUpperCase(),nn=n.value.trim();
    if(cc.length!==6||!nn){err.textContent='Escribe el código de 6 caracteres y tu nombre.';return}connect(cc,nn)};
  show(h('Unirse a una sala'),el('div',{class:'card'},el('label',{},'Código',c),el('label',{},'Nombre',n),err,el('button',{class:'btn',onclick:go},'Entrar')));
}
function tok(){try{let t=localStorage.getItem('kt-tok');if(!t){t=crypto.randomUUID();localStorage.setItem('kt-tok',t)}return t}catch{return crypto.randomUUID()}}
function msgView(a,b){show(el('div',{class:'center card'},h(a),b?p(b):null))}
function connect(code,name){
  if(S&&S.peer)try{S.peer.destroy()}catch{}
  S={code,name,tok:tok(),peer:new Peer()};msgView('Conectando…');
  const to=setTimeout(()=>studentJoin(code,'No hubo respuesta de la sala. Verifica el código o la red.'),15000);
  S.peer.on('open',()=>{
    const c=S.peer.connect('kt-'+code,{reliable:true});S.conn=c;
    c.on('open',()=>c.send({t:'join',name,tok:S.tok}));
    c.on('data',m=>{clearTimeout(to);onStu(m)});
    c.on('close',()=>{clearInterval(S.iv);msgView('Conexión cerrada','La sala terminó o se perdió la red. Si fue la red, recarga e ingresa con el mismo código y nombre.')});
  });
  S.peer.on('error',e=>{clearTimeout(to);studentJoin(code,e.type==='peer-unavailable'?'Código no encontrado.':'Error de conexión ('+e.type+').')});
}
function onStu(m){
  clearInterval(S.iv);
  if(m.t==='err')studentJoin(S.code,m.m);
  else if(m.t==='ok')msgView('Estás dentro, '+m.name,'Espera a que el docente inicie el test.');
  else if(m.t==='q'){
    if(m.done)return msgView('Respuesta enviada','Espera el resultado.');
    const end=Date.now()+m.ms,bar=el('div'),tot=Math.max(m.ms,1);
    show(p('Pregunta '+(m.idx+1)+' de '+m.total),h(m.text),el('div',{class:'bar'},bar),
      el('div',{class:'opts'},m.opts.map((o,k)=>el('button',{class:'opt c'+k,onclick:()=>{S.conn.send({t:'ans',tok:S.tok,i:k});clearInterval(S.iv);msgView('Respuesta enviada','Espera el resultado.')}},el('i',{},SH[k]),o))));
    S.iv=setInterval(()=>{bar.style.width=Math.max(0,(end-Date.now())/tot*100)+'%'},200);
  }else if(m.t==='res'){
    show(el('div',{class:'center card'},
      el('div',{class:'big '+(m.ok?'ok':'bad')},m.ok?'✓':'✗'),
      h(m.ok?'Correcto (+'+m.pts+')':m.answered?'Incorrecto':'Sin respuesta'),
      p('Puntaje: '+m.score+' · Posición: '+m.rank)));
  }else if(m.t==='end'){
    show(el('div',{class:'center card'},p('Test terminado'),el('div',{class:'big'},'#'+m.rank),h(m.score+' puntos'),p('de '+m.n+' participantes')));
  }
}
home();
</script>
</body>
</html>
