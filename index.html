<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - Kahoot estilo</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f8ff;
      --bg-subtle: #e8f0f8;
      --fg: #2c3e50;
      --muted: #7f8c8d;
      --accent: #e74c3c;
      --accent-dim: #c0392b;
      --correct: #27ae60;
      --wrong: #e74c3c;
      --card: #ffffff;
      --question-bg: #ebf5fb;
      --timer-bg: #e74c3c;
      --timer-fg: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* Fondo celestial suave */
    .sky-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #87ceeb 0%, #ffffff 100%);
      z-index: -1;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
    }

    h1, h2, h3 {
      font-family: 'Orbitron', monospace;
      letter-spacing: 2px;
    }

    h1 { font-size: 2.5rem; text-align: center; margin-bottom: 0.5rem; color: var(--fg); }
    h2 { font-size: 1.8rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; margin-bottom: 1rem; color: var(--fg); }
    h3 { font-size: 1.4rem; margin-top: 1.5rem; color: var(--fg); }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 0.5rem;
      transition: background 0.3s;
    }
    .btn:hover { background: var(--accent-dim); }
    .btn:disabled { background: var(--muted); cursor: not-allowed; }

    /* Student view */
    #student-view { background: var(--card); padding: 2rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #student-view h1 { color: var(--fg); text-align: center; }

    #passphrase-input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; font-size: 1rem; display: none; }
    #upload-btn { width: 100%; margin-top: 1rem; display: none; }

    .question-container { 
      background: var(--question-bg); 
      padding: 2rem; 
      border-radius: 12px; 
      margin-bottom: 1rem;
      border-left: 4px solid var(--accent);
    }
    .question-text { font-size: 1.2rem; margin-bottom: 1.5rem; color: var(--fg); }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .option-btn {
      background: white;
      color: var(--fg);
      border: 2px solid var(--muted);
      padding: 0.8rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: var(--accent); background: var(--bg-subtle); }
    .option-btn.selected { border-color: var(--accent); background: var(--accent); color: white; }
    .option-btn.correct { border-color: var(--correct); background: rgba(39,174,96,0.15); color: var(--correct); }
    .option-btn.wrong { border-color: var(--wrong); background: rgba(231,76,60,0.15); color: var(--wrong); }

    /* Timer display - celeste bold */
    .timer-display {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--timer-bg);
      color: var(--timer-fg);
      padding: 0.8rem 1.5rem;
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      min-width: 140px;
      text-align: center;
      border-radius: 4px;
      font-weight: bold;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .podium { margin-top: 2rem; }
    .podium h3 { color: var(--accent); text-align: center; margin-bottom: 1rem; }
    .podium-list { list-style: none; padding: 0; margin: 0; }
    .podium-list li { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 0.8rem 0; border-bottom: 2px solid var(--bg-subtle); 
    }
    .podium-list .name { font-weight: bold; color: var(--fg); }
    .podium-list .score { color: var(--muted); }

    .export-btn { margin-top: 1rem; display: none; }
    .export-btn.show { display: block; }

    /* Code display */
    .session-code { font-family: 'Orbitron', monospace; font-size: 1.5rem; color: var(--accent); text-align: center; margin: 1rem 0; user-select: all; }
  </style>
</head>
<body>

  <!-- Fondo cielo -->
  <div class="sky-bg"></div>

  <!-- Timer display -->
  <div class="timer-display" id="timer-display">10s</div>

  <div class="container">
    <!-- Student View -->
    <div id="student-view">
      <h1>Test - Participa</h1>
      <div style="margin-bottom:2rem;">
        <label for="student-nick" style="display:block; font-size:0.9rem;">Tu nombre:</label>
        <input type="text" id="student-nick" placeholder="Tu nombre" style="width:100%; padding:0.5rem; margin-top:0.5rem;">
      </div>

      <div id="question-container" class="question-container">
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options"></div>
      </div>

      <div class="podium" id="podium">
        <h3>Podio</h3>
        <ul class="podium-list" id="podium-list">
          <!-- dynamic -->
        </ul>
      </div>

      <button class="btn export-btn" id="export-csv" style="display:none;">Exportar resultados CSV</button>
    </div>
  </div>

  <script>
    // ==================== Configuración ====================
    const TIME_LIMIT = 10; // segundos por pregunta (cambiado de 30 a 10)

    // ==================== Estado global ====================
    let testData = []; // arreglo de preguntas [{question, options:[], correctIndex}]
    let currentQuestionIndex = 0;
    let sessionCode = '';
    let studentNick = '';
    let studentAnswers = []; // {questionIndex, selectedIndex, correct, time}
    let timerInterval = null;
    let remainingTime = TIME_LIMIT;

    // ==================== Canvas background ====================
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Fondo estrellado sutil
    function drawStars() {
      const stars = [];
      const starCount = 30;
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.5 + 0.2
        });
      }
      let t = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.016;
        stars.forEach(s => {
          s.y += s.speed;
          if (s.y > canvas.height) {
            s.y = 0;
            s.x = Math.random() * canvas.width;
          }
          ctx.fillStyle = '#e0f7fa'; // celeste muy claro
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }

    drawStars();

    // ==================== Utilidades CSV ====================
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const records = [];
      for (let line of lines) {
        if (!line.trim() || line.startsWith('#')) continue;
        const fields = line.split(',').map(f => f.trim());
        if (fields.length >= 6) {
          const correctIndex = parseInt(fields[5], 10);
          const normalizedIndex = (correctIndex >= 1 && correctIndex <= 4) ? correctIndex - 1 : correctIndex;
          records.push({
            question: fields[0],
            options: [fields[1], fields[2], fields[3], fields[4]],
            correctIndex: normalizedIndex
          });
        }
      }
      return records;
    }

    // ==================== Cargar test.csv automáticamente ====================
    function loadTestCSV() {
      return new Promise((resolve, reject) => {
        fetch('test.csv')
          .then(response => {
            if (!response.ok) {
              throw new Error('No se pudo cargar test.csv');
            }
            return response.text();
          })
          .then(text => {
            const parsed = parseCSV(text);
            if (parsed.length === 0) {
              alert('El archivo test.csv no contiene preguntas válidas o está vacío.');
              reject('No hay preguntas en test.csv');
              return;
            }
            resolve(parsed);
          })
          .catch(error => {
            console.error('Error cargando test.csv:', error);
            alert('No se pudo cargar el archivo de preguntas.');
            reject(error);
          });
      });
    }

    // ==================== Generar código de sesión ====================
    function generateSessionCode() {
      return Math.random().toString(36).substr(2, 6).toUpperCase();
    }

    // ==================== Timer functionality ====================
    function startTimer() {
      // Detener timer anterior si existe
      stopTimer();

      remainingTime = TIME_LIMIT;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingTime--;
        updateTimerDisplay();

        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          timerDisplay.style.display = 'none';
          // Avanzar a la siguiente pregunta con puntuación 0
          studentAnswers.push({
            questionIndex: currentQuestionIndex,
            selectedIndex: -1,
            correct: false,
            time: new Date().getTime()
          });
          currentQuestionIndex++;
          showQuestion();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      timerDisplay.textContent = `${remainingTime}s`;
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerDisplay.style.display = 'none';
    }

    const timerDisplay = document.getElementById('timer-display');

    // ==================== Cargar y empezar el test ====================
    async function initApp() {
      // Cargar test.csv automáticamente
      testData = await loadTestCSV();

      // Generar código de sesión
      sessionCode = generateSessionCode();

      // Mostrar vista de estudiante
      document.getElementById('student-view').style.display = 'block';

      // Pregunta 0: Pedir nombre
      askForName();
    }

    function askForName() {
      document.getElementById('question-text').textContent = '¡Bienvenido al test!';

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';

      const nickInput = document.getElementById('student-nick');
      const nick = nickInput.value.trim();

      if (!nick) {
        const msg = document.createElement('p');
        msg.textContent = 'Por favor, ingresa tu nombre arriba y presiona Enter';
        optionsEl.appendChild(msg);
        nickInput.style.display = 'block';
        return;
      }

      // Guardar nombre
      studentNick = nick;
      localStorage.setItem('student_nick', studentNick);
      nickInput.style.display = 'none';

      // Iniciar timer y mostrar primera pregunta
      startTimer();
      showQuestionWithoutTimer();
    }

    function showQuestionWithoutTimer() {
      const q = testData[currentQuestionIndex];
      if (!q) {
        endTest();
        return;
      }

      document.getElementById('question-text').textContent = `Pregunta ${currentQuestionIndex + 1}/${testData.length}: ${q.question}`;

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
        btn.dataset.index = i;
        btn.addEventListener('click', () => selectOption(btn));
        optionsEl.appendChild(btn);
      });

      // Remover selección anterior
      document.querySelectorAll('.option-btn.selected').forEach(b => b.classList.remove('selected'));
    }

    // ==================== Vista Estudiante ====================
    function startNewSession() {
      currentQuestionIndex = 0;
      studentNick = document.getElementById('student-nick').value.trim() || 'Jugador';
      localStorage.setItem('student_nick', studentNick);
      studentAnswers = [];
      stopTimer();

      document.getElementById('student-nick').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      const q = testData[currentQuestionIndex];
      if (!q) {
        endTest();
        return;
      }

      document.getElementById('question-text').textContent = `Pregunta ${currentQuestionIndex + 1}/${testData.length}: ${q.question}`;

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
        btn.dataset.index = i;
        btn.addEventListener('click', () => selectOption(btn));
        optionsEl.appendChild(btn);
      });

      // Reiniciar timer para esta pregunta
      startTimer();
    }

    function selectOption(btn) {
      // Detener timer inmediatamente al responder
      stopTimer();

      // Marcar selección
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      const selectedIdx = parseInt(btn.dataset.index, 10);
      const correctIdx = testData[currentQuestionIndex].correctIndex;
      const isCorrect = selectedIdx === correctIdx;

      // Feedback visual
      btn.classList.add(isCorrect ? 'correct' : 'wrong');

      // Guardar respuesta
      studentAnswers.push({
        questionIndex: currentQuestionIndex,
        selectedIndex: selectedIdx,
        correct: isCorrect,
        time: new Date().getTime()
      });

      // Actualizar podio
      updatePodium();

      // Esperar 1.5 segundos y avanzar
      setTimeout(() => {
        currentQuestionIndex++;
        showQuestion();
      }, 1500);
    }

    // ==================== Podio ====================
    function updatePodium() {
      const key = `session_answers_${sessionCode}`;
      let saved = JSON.parse(localStorage.getItem(key) || '[]');

      saved = saved || [];
      studentAnswers.forEach(s => {
        const existing = saved.find(x => x.nick === studentNick);
        if (existing) {
          existing.score = (existing.score || 0) + (s.correct ? 1 : 0);
        } else {
          saved.push({ nick: studentNick, score: s.correct ? 1 : 0 });
        }
      });
      localStorage.setItem(key, JSON.stringify(saved));

      // ORDENAR y LIMITAR a la cantidad total de preguntas
      const maxPossible = testData.length;
      saved.sort((a, b) => b.score - a.score);

      // Asegurar que ningun score supere la cantidad de preguntas
      saved.forEach(entry => {
        if (entry.score > maxPossible) entry.score = maxPossible;
      });

      const top3 = saved.slice(0, 3);

      const listEl = document.getElementById('podium-list');
      listEl.innerHTML = '';
      top3.forEach((entry, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="name">${i + 1}. ${entry.nick}</span><span class="score">${entry.score}/${maxPossible}</span>`;
        listEl.appendChild(li);
      });
    }

    // ==================== Final del test ====================
    function endTest() {
      // Actualizar podium final con validación
      updatePodiumFinal();

      document.getElementById('export-csv').classList.add('show');

      const resultsEl = document.getElementById('question-container');
      const correctCount = studentAnswers.filter(a => a.correct).length;
      resultsEl.innerHTML = `
        <h2>¡Test finalizado!</h2>
        <p>Tu puntuación: ${correctCount} de ${studentAnswers.length} correctas.</p>
        <div class="podium" style="margin-top:2rem;">
          <h3>Podio final</h3>
          <ul class="podium-list" id="final-podium-list">
          </ul>
        </div>
      `;

      // Ranking final con validación
      const key = `session_answers_${sessionCode}`;
      const allData = JSON.parse(localStorage.getItem(key) || '[]');
      
      // Validar que ningun score supere la cantidad de preguntas
      const maxPossible = testData.length;
      allData.forEach(entry => {
        if (entry.score > maxPossible) entry.score = maxPossible;
      });

      allData.sort((a, b) => b.score - a.score);
      const top3 = allData.slice(0, 3);
      const listEl = document.getElementById('final-podium-list');
      listEl.innerHTML = '';
      top3.forEach((entry, i) => {
        const li = document.createElement('li');
        li.textContent = `${i + 1}. ${entry.nick} - ${entry.score}/${maxPossible} aciertos`;
        listEl.appendChild(li);
      });

      document.getElementById('export-csv').onclick = exportCSV;
    }

    function updatePodiumFinal() {
      // Versión simple - los datos ya se validaron en updatePodium
    }

    function exportCSV() {
      const key = `session_answers_${sessionCode}`;
      const allData = JSON.parse(localStorage.getItem(key) || '[]');

      if (allData.length === 0) {
        alert('No hay datos para exportar.');
        return;
      }

      // Usar el nick guardado o 'Jugador'
      const nickName = allData.find(a => a.nick)?.nick || 'Jugador';
      
      let csv = 'Estudiante,Aciertos,Total Preguntas\n';
      allData.forEach(row => {
        // Asegurar que no exceda total preguntas
        const safeScore = Math.min(row.score || 0, testData.length);
        csv += `${row.nick || nickName},${safeScore},${testData.length}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `resultados_test_${sessionCode}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ==================== Eventos ====================
    window.addEventListener('load', () => {
      initApp();
    });

    document.getElementById('student-nick').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        askForName();
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
